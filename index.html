<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doodle Reader</title>

    <!-- Design System CSS -->
    <link rel="stylesheet" href="/index.css">

    <!-- Tailwind CDN with new config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: {
                DEFAULT: '#1a1a1a',
                soft: '#2d2d2d',
                muted: '#4a4a4a',
              },
              cream: {
                DEFAULT: '#fdfbf7',
                warm: '#f5f2eb',
                dark: '#e8e4db',
              },
              accent: {
                DEFAULT: '#6366f1',
                muted: '#818cf8',
                soft: '#c7d2fe',
              },
              surface: {
                DEFAULT: '#ffffff',
                elevated: '#fafafa',
                sunken: '#f5f5f1',
              },
              status: {
                success: '#22c55e',
                warning: '#f59e0b',
                error: '#ef4444',
                info: '#3b82f6',
              },
              border: {
                DEFAULT: '#e5e5e5',
                strong: '#1a1a1a',
                muted: '#f0f0f0',
              },
              // Legacy aliases for gradual migration
              reader: {
                bg: '#fdfbf7',
                surface: '#ffffff',
                sidebar: '#f5f2eb',
                select: '#c7d2fe',
                'select-text': '#1a1a1a',
                active: '#6366f1',
                text: '#1a1a1a',
                secondary: '#4a4a4a',
                border: '#e5e5e5',
                snippet: '#4a4a4a',
                fab: '#c7d2fe',
                'fab-hover': '#a5b4fc',
                red: '#ef4444',
                blue: '#6366f1',
                green: '#22c55e',
                yellow: '#f59e0b'
              }
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
            },
            borderRadius: {
              'sm': '4px',
              'DEFAULT': '6px',
              'md': '8px',
              'lg': '12px',
              'xl': '16px',
              '2xl': '20px',
              '4xl': '32px',
            },
            boxShadow: {
              'soft': '0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06)',
              'medium': '0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06)',
              'elevated': '0 10px 25px rgba(0,0,0,0.06), 0 5px 10px rgba(0,0,0,0.04)',
              'brutal': '4px 4px 0 0 #1a1a1a',
              'brutal-sm': '2px 2px 0 0 #1a1a1a',
              'brutal-hover': '6px 6px 0 0 #1a1a1a',
              'card': '0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15)',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
