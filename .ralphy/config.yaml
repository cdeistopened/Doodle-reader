# Ralphy Configuration
# https://github.com/michaelshimeles/ralphy

# Project info (auto-detected, edit if needed)
project:
  name: "doodle-reader"
  language: "TypeScript"
  framework: "React + Vite + Convex"
  description: "Playful RSS reader that converts content to clean markdown"

# Commands (auto-detected from package.json/pyproject.toml)
commands:
  test: ""
  lint: ""
  build: "npm run build"

# Rules - instructions the AI MUST follow
# These are injected into every prompt
rules:
  - "Read CLAUDE.md before starting any task"
  - "Use React functional components with hooks"
  - "All backend operations go through Convex (convex/ folder)"
  - "Use Tailwind CSS for styling, follow existing patterns in index.css"
  - "Components go in components/ folder"
  - "Use the existing modal pattern (see components/*Modal.tsx)"
  - "Keyboard shortcuts should be added to the existing handler in App.tsx"
  - "Run npm run build to verify TypeScript compiles before committing"

# Boundaries - files/folders the AI should not modify
boundaries:
  never_touch:
    - "convex/_generated/**"
    - "*.lock"
    - ".beads/**"
    - "pagesnap/**"
    - "sandbox/**"
